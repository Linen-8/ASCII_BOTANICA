<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Animated ASCII Flower Garden</title>
  <meta name="description" content="Interactive 3D animated ASCII flower art featuring real-time procedural botanical geometry, phosphor glow, audio soundscape, and CRT aesthetics.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Fullscreen 3D ASCII Canvas -->
  <canvas id="ascii-canvas" aria-label="3D Animated ASCII Flower Art"></canvas>

  <!-- Interactive HUD Interface -->
  <div id="hud" class="hud-container">
    <!-- Top HUD: Header + Presets -->
    <div class="hud-top">
      <header class="hud-header">
        <div class="brand">
          <div class="status-indicator" title="Engine Active"></div>
          <div class="brand-text">
            <h1 class="title">ASCII BOTANICA 3D</h1>
            <span class="subtitle">Procedural Floral Ascii Engine</span>
          </div>
          <div class="stats-badge" title="Real-time rendering metrics">
            <span id="stat-fps">60 FPS</span>
            <span class="dot">•</span>
            <span id="stat-grid">120×60</span>
          </div>
        </div>

        <!-- Search Feature -->
        <div class="search-container">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-flower" placeholder="Search flower species..." aria-label="Search flower species" autocomplete="off">
            <div id="search-suggestions" class="search-suggestions"></div>
          </div>
        </div>

        <!-- Quick Action Utilities -->
        <div class="quick-actions">
          <button id="btn-audio" class="action-btn" aria-label="Toggle Ambient Sound" aria-pressed="false" title="Toggle Soundscape [M]">
            <span class="audio-waves" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span class="audio-label">Sound Off</span>
          </button>

          <button id="btn-copy-ascii" class="action-btn" title="Copy ASCII Art snapshot to Clipboard [S]">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>Copy</span>
          </button>

          <button id="btn-download-txt" class="action-btn" title="Download ASCII Art as Text File">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>.TXT</span>
          </button>

          <button id="btn-screenshot" class="action-btn" title="Save PNG Screenshot">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span>Capture</span>
          </button>

          <button id="btn-reset-cam" class="action-btn icon-only" title="Reset 3D Camera [R]" aria-label="Reset Camera">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          </button>

          <button id="btn-toggle-inspector" class="action-btn icon-only" title="Toggle Controls [Tab]" aria-label="Toggle Controls">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          </button>

          <button id="btn-zen" class="action-btn icon-only" title="Zen Mode / Hide All HUD [H]" aria-label="Toggle Zen Mode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </header>

      <!-- Preset Experience Bar -->
      <div class="preset-strip-wrap">
        <div class="preset-label">CURATED PRESETS</div>
        <div id="preset-chips" class="preset-chips"></div>
      </div>
    </div>

    <!-- Floating Modular Inspector Panel -->
    <aside class="control-panel" id="control-panel" aria-label="Flower Controls">
      <div class="panel-header">
        <span class="panel-header-title">INSPECTOR</span>
        <button id="btn-close-panel" class="panel-close-btn" title="Minimize [Tab]" aria-label="Close panel">✕</button>
      </div>

      <div class="panel-section">
        <span class="section-title">FLORA GEOMETRY</span>
        <div class="control-row">
          <label for="select-mode">Display Mode</label>
          <select id="select-mode" class="hud-select">
            <option value="solo">Solo Specimen</option>
            <option value="garden">Botanical Garden 🌸</option>
          </select>
        </div>
        <div class="control-row">
          <label for="slider-scale">Global Scale</label>
          <input type="range" id="slider-scale" min="0.2" max="3.0" step="0.1" value="1.0" class="hud-range">
        </div>
        <div class="control-row">
          <label for="select-flower">Species</label>
          <select id="select-flower" class="hud-select"></select>
        </div>
      </div>

      <div class="panel-section">
        <span class="section-title">ASCII RENDERING</span>
        <div class="control-row">
          <label for="select-palette">Palette</label>
          <select id="select-palette" class="hud-select"></select>
        </div>
        <div class="control-row">
          <label for="select-glyphs">Glyphs</label>
          <select id="select-glyphs" class="hud-select"></select>
        </div>
        <div class="control-row">
          <label for="slider-fontsize">Resolution</label>
          <input type="range" id="slider-fontsize" min="8" max="20" step="1" value="12" class="hud-range">
        </div>
      </div>

      <div class="panel-section">
        <span class="section-title">MOTION & ORGANICS</span>
        <div class="control-row">
          <label for="slider-bloom">Bloom</label>
          <input type="range" id="slider-bloom" min="0.3" max="1.4" step="0.05" value="0.9" class="hud-range">
        </div>
        <div class="control-row checkbox-row">
          <label for="check-autobloom">Breathing Pulse</label>
          <input type="checkbox" id="check-autobloom" checked class="hud-checkbox">
        </div>
        <div class="control-row">
          <label for="slider-wind">Wind Flutter</label>
          <input type="range" id="slider-wind" min="0.0" max="2.0" step="0.1" value="1.0" class="hud-range">
        </div>
        <div class="control-row">
          <label for="slider-rotation">3D Orbit</label>
          <input type="range" id="slider-rotation" min="0.0" max="1.2" step="0.05" value="0.35" class="hud-range">
        </div>
        <div class="control-row checkbox-row">
          <label for="check-autorotate">Auto-Turntable</label>
          <input type="checkbox" id="check-autorotate" checked class="hud-checkbox">
        </div>
      </div>

      <div class="panel-section">
        <span class="section-title">POST-PROCESSING</span>
        <div class="checkbox-grid">
          <label class="check-chip">
            <input type="checkbox" id="check-scanlines" checked class="hud-checkbox">
            <span>Scanlines</span>
          </label>
          <label class="check-chip">
            <input type="checkbox" id="check-glow" checked class="hud-checkbox">
            <span>Phosphor Glow</span>
          </label>
          <label class="check-chip">
            <input type="checkbox" id="check-vignette" checked class="hud-checkbox">
            <span>Vignette</span>
          </label>
          <label class="check-chip">
            <input type="checkbox" id="check-dither" checked class="hud-checkbox">
            <span>Bayer Dither</span>
          </label>
        </div>
      </div>
    </aside>

    <!-- Bottom Instruction & Shortcuts Bar -->
    <footer class="hud-footer">
      <div class="interaction-hints">
        <span class="hint-pill"><kbd>Drag</kbd> Orbit 3D</span>
        <span class="hint-pill"><kbd>Click</kbd> Wind Ripple</span>
        <span class="hint-pill"><kbd>Scroll</kbd> Zoom</span>
        <span class="hint-pill"><kbd>Space</kbd> Breathe</span>
        <span class="hint-pill"><kbd>V</kbd> Garden Mode</span>
        <span class="hint-pill"><kbd>F</kbd> Species</span>
        <span class="hint-pill"><kbd>C</kbd> Palette</span>
        <span class="hint-pill"><kbd>G</kbd> Glyphs</span>
        <span class="hint-pill"><kbd>Tab</kbd> Panel</span>
        <span class="hint-pill"><kbd>H</kbd> Zen</span>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Box -->
  <div id="toast" class="hud-toast" role="status" aria-live="polite"></div>

  <!-- Main script -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
